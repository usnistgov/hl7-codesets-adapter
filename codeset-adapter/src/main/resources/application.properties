server.max-http-request-header-size=64KB

jwt.secret=jwtSecret
spring.data.mongodb.uri=mongodb://codesets-adapter-db:27017/codeset-adapter
# spring.data.mongodb.uri=mongodb://localhost:27017/codeset-adapter
db.name=codeset-adapter
db.host=codesets-adapter-db
db.port=27017


phinvads.export.dir=./data/phinvads-export
phinvads.export.delay-between-calls-ms=3000
phinvads.export.delay-between-codesets-ms=5000
phinvads.export.page-size=5000
phinvads.export.max-retries=3
phinvads.export.retry-delay-ms=30000
phinvads.export.all-versions=true
# Cap on the number of codesets to process per run (0 = no cap).
phinvads.export.max-codesets=0